plugins {
    id "com.android.application"
    id "com.google.devtools.ksp"
    id "androidx.room"
}

def releaseStoreFile = System.getenv("GALERIA_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("GALERIA_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("GALERIA_KEY_ALIAS")
def releaseKeyPassword = System.getenv("GALERIA_KEY_PASSWORD")
def releaseSigningConfigured = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains("release") } && !releaseSigningConfigured) {
        throw new GradleException("Configure as variáveis GALERIA_KEYSTORE_FILE, GALERIA_STORE_PASSWORD, GALERIA_KEY_ALIAS e GALERIA_KEY_PASSWORD para gerar uma build release assinada.")
    }
}

android {
    namespace = "com.galeria.android"
    compileSdk 37

    defaultConfig {
        applicationId = "com.galeria.android"
        minSdk 23
        targetSdk 37
        versionCode = 8072
        versionName = "0.8.72"
        testInstrumentationRunner providers.gradleProperty("ocrReleaseSmoke").orNull == "true"
            ? "com.galeria.android.OcrReleaseSmokeRunner" : "com.galeria.android.GalleryTestRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        benchmark {
            initWith release
            signingConfig = signingConfigs.debug
            debuggable false
            minifyEnabled false
            shrinkResources = false
            matchingFallbacks = ["release"]
        }
    }
}

room {
    schemaDirectory "$projectDir/schemas"
}

// Debug instrumentation cannot catch reflection stripped only in release.
// Fail every release assembly if its optimized OCR registrars lose their entry points.
def releaseOcrRegistrars = [
    "com.google.mlkit.common.internal.CommonComponentRegistrar",
    "com.google.mlkit.vision.common.internal.VisionCommonRegistrar",
    "com.google.mlkit.vision.text.internal.TextRegistrar"
]
def verifyReleaseOcrComponents = tasks.register("verifyReleaseOcrComponents") {
    group = "verification"
    description = "Checks that optimized release OCR registrars retain their reflective constructors."
    dependsOn "minifyReleaseWithR8"
    def seedsFile = layout.buildDirectory.file("outputs/mapping/release/seeds.txt")
    def usageFile = layout.buildDirectory.file("outputs/mapping/release/usage.txt")
    inputs.files(seedsFile, usageFile)
    doLast {
        def seeds = seedsFile.get().asFile.readLines() as Set
        def usage = usageFile.get().asFile.readLines()
        releaseOcrRegistrars.each { registrar ->
            def constructor = "${registrar}: ${registrar.tokenize('.').last()}()".toString()
            if (!seeds.contains(registrar) || !seeds.contains(constructor) || usage.contains(registrar)) {
                throw new GradleException("OCR release inválido: preservar classe e construtor de ${registrar} nas regras R8.")
            }
        }
        logger.lifecycle("OCR release: os 3 registradores e seus construtores foram preservados pelo R8.")
    }
}
tasks.matching { it.name == "assembleRelease" }.configureEach {
    dependsOn verifyReleaseOcrComponents
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1") {
            because "Align the app runtime with Room migration testing's serialization JSON 1.8.1"
        }
    }

    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.media3:media3-exoplayer:1.10.1"
    implementation "androidx.media3:media3-ui:1.10.1"
    implementation "io.coil-kt.coil3:coil:3.6.2"
    implementation "io.coil-kt.coil3:coil-video:3.6.2"
    implementation "io.github.panpf.zoomimage:zoomimage-view-coil3:1.6.0"
    implementation "androidx.room:room-runtime:2.8.5"
    implementation "androidx.room:room-paging:2.8.5"
    implementation "androidx.paging:paging-runtime:3.5.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    ksp "androidx.room:room-compiler:2.8.5"
    implementation "androidx.work:work-runtime:2.11.2"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    implementation "com.google.mlkit:text-recognition:16.0.1"

    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.test:core-ktx:1.7.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "androidx.test.ext:junit-ktx:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "androidx.room:room-testing:2.8.5"
}
