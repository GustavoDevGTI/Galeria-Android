plugins {
    id "com.android.application"
    id "com.google.devtools.ksp"
    id "androidx.room"
}

android {
    namespace = "com.galeria.android"
    compileSdk 37

    defaultConfig {
        applicationId = "com.galeria.android"
        minSdk 23
        targetSdk 37
        versionCode 8
        versionName "0.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

room {
    schemaDirectory "$projectDir/schemas"
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.media3:media3-exoplayer:1.10.1"
    implementation "androidx.media3:media3-ui:1.10.1"
    implementation "io.coil-kt.coil3:coil:3.5.0"
    implementation "io.coil-kt.coil3:coil-video:3.5.0"
    implementation "io.github.panpf.zoomimage:zoomimage-view-coil3:1.6.0"
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-paging:2.8.4"
    implementation "androidx.paging:paging-runtime:3.5.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    ksp "androidx.room:room-compiler:2.8.4"
    implementation "androidx.work:work-runtime:2.11.2"
}
