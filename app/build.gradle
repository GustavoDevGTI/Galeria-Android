plugins {
    id "com.android.application"
    id "com.google.devtools.ksp"
    id "androidx.room"
}

def releaseStoreFile = System.getenv("GALERIA_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("GALERIA_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("GALERIA_KEY_ALIAS")
def releaseKeyPassword = System.getenv("GALERIA_KEY_PASSWORD")
def releaseSigningConfigured = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains("release") } && !releaseSigningConfigured) {
        throw new GradleException("Configure as variáveis GALERIA_KEYSTORE_FILE, GALERIA_STORE_PASSWORD, GALERIA_KEY_ALIAS e GALERIA_KEY_PASSWORD para gerar uma build release assinada.")
    }
}

android {
    namespace = "com.galeria.android"
    compileSdk 37

    defaultConfig {
        applicationId = "com.galeria.android"
        minSdk 23
        targetSdk 37
        versionCode = 8023
        versionName = "0.8.23"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        benchmark {
            initWith release
            signingConfig = signingConfigs.debug
            debuggable false
            minifyEnabled false
            shrinkResources = false
            matchingFallbacks = ["release"]
        }
    }
}

room {
    schemaDirectory "$projectDir/schemas"
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.media3:media3-exoplayer:1.10.1"
    implementation "androidx.media3:media3-ui:1.10.1"
    implementation "io.coil-kt.coil3:coil:3.5.0"
    implementation "io.coil-kt.coil3:coil-video:3.5.0"
    implementation "io.github.panpf.zoomimage:zoomimage-view-coil3:1.6.0"
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-paging:2.8.4"
    implementation "androidx.paging:paging-runtime:3.5.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    ksp "androidx.room:room-compiler:2.8.4"
    implementation "androidx.work:work-runtime:2.11.2"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"

    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.test:core-ktx:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.1"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit-ktx:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.room:room-testing:2.8.4"
}
