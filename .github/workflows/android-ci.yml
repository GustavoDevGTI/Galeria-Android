name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew

      - name: Validate test tooling contracts
        shell: pwsh
        run: ./scripts/test-validation-tools.ps1

      - name: Validate Android project
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Check non-empty unit and lint results
        shell: pwsh
        run: |
          . ./scripts/validation-common.ps1
          Get-GalleryUnitResult 'app/build/test-results/testDebugUnitTest' 225
          Get-GalleryLintResult 'app/build/reports/lint-results-debug.xml'

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: galeria-debug-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload instrumentation APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: galeria-debug-tests-${{ github.run_attempt }}
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
